<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local reader QA</title><style>body{height:100vh;overflow:hidden;margin:0;background:#0b0d12;color:white;font:14px system-ui}iframe{border:0;width:100%;height:100vh;display:block}#controls{position:fixed;bottom:0;left:0;right:0;z-index:9999;padding:5px;background:#141820;max-height:190px;overflow:auto}#controls.compact>*:not(#qa-toggle){display:none}button,input,select{font:inherit;min-height:44px;max-width:100%}pre{white-space:pre-wrap}</style>
<div id="controls"><button id="qa-toggle">QA controls</button><label>QA case <select id="case"></select></label><button id="saved">Open saved chapter</button><button id="load">Load reader</button><label>Pair <input id="pair" type="number" value="1" min="1" style="width:65px"></label><button id="jump">Show pair</button><button id="count">Count English lines</button><button id="audio">Check audio limit</button><button id="offline">Check offline shell</button><button id="grading">Check typed answers</button><button id="migration">Check retained study data</button><button id="master">Master parfois</button><button id="quiz">Single word quiz setup</button><button id="cloze">Check fill-in context</button><button id="choices">Choice duplicates</button><pre id="report"></pre></div><iframe id="app" title="Actual reader app"></iframe>
<script type="module">
document.querySelector("#qa-toggle").onclick=()=>document.querySelector("#controls").classList.toggle("compact");
const cases = [['embers-beneath-the-mountains',1],['embers-beneath-the-mountains',9],['embers-beneath-the-mountains',50],['embers-beneath-the-mountains',120],['embers-beneath-the-mountains',200],['embers-beneath-the-mountains',300],['the-river-repair-shop',1],['le-petit-manuel-du-cidrier-amateur',1],['le-petit-manuel-du-cidrier-amateur',10],['la-derniere-voix-claire',20]];
const select=document.querySelector('#case'),frame=document.querySelector('#app'),report=document.querySelector('#report');
for(const [book,ch] of cases){const o=document.createElement('option');o.value=book+'/'+ch;o.textContent=book+' ch-'+ch;select.append(o)}
for(const reg of await navigator.serviceWorker.getRegistrations())await reg.unregister();for(const key of await caches.keys())if(key.startsWith('reader-shell-'))await caches.delete(key);
frame.src='/app/index.html';await new Promise(resolve=>frame.onload=resolve);
for(const b of document.querySelectorAll('button'))if(b.id!=='qa-toggle')b.disabled=true;
const wait=()=>new Promise(r=>setTimeout(r,30));while(frame.contentDocument?.body?.dataset.view!=='home')await wait();
const db=await frame.contentWindow.eval('import("/app/js/db.js")');const reader=await frame.contentWindow.eval('import("/app/js/reader.js")');
// Explicit local test harness; no secret is read or transmitted and no AI is invoked.
await db.updateSettings({openaiKey:'',feedbackToken:'',showEnglish:true,readerScript:'pinyin',hideMastered:false});
const vault=await frame.contentWindow.eval('import("/app/js/vault.js")');
document.querySelector('#audio').onclick=async()=>{
 const speech=await frame.contentWindow.eval('import("/app/js/speech.js")');speech.unlockAudio();
 const bytes=new ArrayBuffer(204),v=new DataView(bytes);const text=(at,s)=>[...s].forEach((c,i)=>v.setUint8(at+i,c.charCodeAt(0)));text(0,'RIFF');v.setUint32(4,196,true);text(8,'WAVE');text(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);text(36,'data');v.setUint32(40,160,true);
 const cache=await caches.open('tts-audio-v1');for(let i=0;i<30;i++){await cache.put('/app/tts-cache/2/gpt-4o-mini-tts/nova/fr/qa'+i,new Response(bytes.slice(0)));speech.prefetchSpeech('qa'+i,'fr')}
 await new Promise(r=>setTimeout(r,500));report.textContent='Decoded audio after 30 loads: '+speech.decodedAudioCount()+' (limit 24); persistent bytes: '+(await cache.keys()).length;
};
document.querySelector('#offline').onclick=async()=>{const reg=await frame.contentWindow.navigator.serviceWorker.register('/app/sw.js',{scope:'/app/'});await frame.contentWindow.navigator.serviceWorker.ready;const cache=await caches.open('reader-shell-v52');const needed=['vendor/hanzi-writer.min.js','vendor/pinyin-pro.js','icons/icon-180.png'];const entries=await cache.keys();report.textContent=needed.map(p=>p+': '+(entries.some(e=>e.url.endsWith('/app/'+p))?'PASS':'FAIL')).join('\n');};
document.querySelector('#grading').onclick=()=>{const rows=[['a','e2t',false],['se','e2t',false],['yan','e2t',false],['yanse','e2t',true],['yán sè','e2t',true],['o','t2e',false],['colour','t2e',true],['color','t2e',true]];report.textContent=rows.map(([answer,dir,expected])=>`${answer}: ${vault.gradeType(answer,{hanzi:'颜色',pinyin:'yánsè',english:'colour',lang:'zh'},dir)===expected?'PASS':'FAIL'}`).join('\n')+'\nnot to run: '+(!vault.gradeType('not to run',{english:'to run'},'t2e')?'PASS':'FAIL')};
document.querySelector('#migration').onclick=async()=>{const data=await Promise.all(['treasure-island','the-left-hand-of-darkness'].map(async id=>({book:id,download:!!await db.getBook(id),progress:!!await db.getProgress(id,id==='treasure-island'?'ch-1':'introduction')})));report.textContent=JSON.stringify({books:data,savedWord:!!await db.getVaultItem('颜色')},null,2)};
document.querySelector('#master').onclick=async()=>{await db.putVaultItem({id:'parfois',hanzi:'parfois',english:'sometimes',lang:'fr',attempts:Array(20).fill(true)});frame.contentWindow.dispatchEvent(new Event('vault:changed'));await vault.ensureMastered();reader.applyMasteredHiding();report.textContent='Mastered French word stored; test English hiding in Reader options.'};
document.querySelector('#quiz').onclick=async()=>{await db.putVaultItem({id:'颜色',hanzi:'颜色',pinyin:'yánsè',english:'colour',lang:'zh',attempts:[]});await db.updateSettings({learningLanguage:'zh',reviewLength:'30',reviewBuckets:['new'],reviewKinds:['word'],reviewDirection:'e2t',reviewAnswerMode:'type'});const lang=await frame.contentWindow.eval('import("/app/js/languages.js")');await lang.setLearningLanguage('zh');frame.contentWindow.dispatchEvent(new CustomEvent('app:setview',{detail:'vault'}));report.textContent='One new word; choose Quiz → Start.'};
document.querySelector('#cloze').onclick=async()=>{const item={id:'pain',hanzi:'pain',english:'bread',lang:'fr',context:{target:'Le pain est dans le panier.',hanzi:'Le pain est dans le panier.',english:'The bread is in the basket.',targetStart:3}};const other={id:'il',hanzi:'il',english:'he',lang:'fr',context:{target:'Il dit il viendra.',hanzi:'Il dit il viendra.',targetStart:0}};await vault.startCardQuiz([{item,dir:'cloze',options:[]},{item:other,dir:'cloze',options:[]}],{title:'Fill-in offsets',lang:'fr'});report.textContent='The blank replaces pain; panier stays intact. Repeated il must fall back to a meaning question.'};
document.querySelector('#choices').onclick=async()=>{const item={id:'alpha',hanzi:'mot',english:'fork',lang:'fr'};await vault.startCardQuiz([{item,dir:'t2e',options:[{id:'b',hanzi:'autre',english:'Fork'},{id:'c',hanzi:'MOT',english:'other'},{id:'d',hanzi:'objet',english:'knife'},{id:'e',hanzi:'truc',english:'spoon'}]}],{title:'Choice duplicates',lang:'fr'});report.textContent='Only fork, knife, spoon should be offered.'};
const library=await(await fetch('/content/library.json')).json();
document.querySelector('#saved').onclick=async()=>{const [book,n]=select.value.split('/'),id=n==='introduction'?n:'ch-'+n;await db.putProgress(book,id,0,0);frame.contentWindow.dispatchEvent(new CustomEvent('nav:reader',{detail:{bookId:book,chapterId:id}}));report.textContent='Opened downloaded '+book+'/'+id;};
document.querySelector('#load').onclick=async()=>{
 const [book,n]=select.value.split('/'),id=n==='introduction'?n:'ch-'+n;
 const meta=library.books.find(b=>b.id===book);
 const chapter=await(await fetch('/content/books/'+book+'/'+id+'.json')).json();
 await db.putBook({...meta,coverBlob:null});await db.putChapter(book,id,chapter);await db.putProgress(book,id,1,0);
 frame.contentWindow.dispatchEvent(new CustomEvent('nav:reader',{detail:{bookId:book,chapterId:id}}));
 while(reader.getReaderContext()?.chapterId!==id||reader.getReaderContext()?.bookId!==book)await wait();
 report.textContent='Loaded '+book+'/'+id;document.querySelector('#pair').value='1';
};
document.querySelector('#jump').onclick=()=>{const i=Number(document.querySelector('#pair').value)-1;const pages=reader.getPageElements();const at=pages.findIndex(p=>p.querySelector('[data-pair="'+i+'"]'));if(at>=0){reader.goToPage(at);pages[at].querySelector('[data-pair="'+i+'"]')?.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'})}report.textContent='Pair '+(i+1)+' on page '+at};
document.querySelector('#count').onclick=()=>{let blocks=0,orphans=0;for(const b of frame.contentDocument.querySelectorAll('.reader-block')){if(!/\p{L}/u.test(b.querySelector('.target')?.textContent||''))continue;blocks++;if(!/\p{L}/u.test(b.querySelector('.english')?.textContent||''))orphans++}report.textContent=JSON.stringify({case:select.value,blocks,orphans,pct:100*orphans/blocks})};
for(const b of document.querySelectorAll('button'))b.disabled=false;report.textContent='Ready';
</script>
